AWSTemplateFormatVersion: '2010-09-09'

Parameters:
        ImageId:
            Type: AWS::EC2::Image::Id
        InstanceType:
            Type: String
            Default: t2.micro

Resources:
      DevEC2Instance:
              Type: AWS::EC2::Instance
              Properties:
                    ImageId: !Ref ImageId
                    InstanceType: !Ref InstanceType
                    
